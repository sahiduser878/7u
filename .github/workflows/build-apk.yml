name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "ERROR: Failed to detect Java version."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "ERROR: Active Java version ($JAVA_VER) is lower than 17."
            exit 1
          fi
          echo "Java environment verified: version 17 or higher confirmed."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping creation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkeypair \
              -alias androiddebugkey \
              -keypass android \
              -keystore ./debug.keystore \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore could not be created."
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: $TARGET_APK does not exist."
            echo "Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -type f -name "*.apk" || true
            exit 1
          fi
          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: $TARGET_APK is empty."
            exit 1
          fi
          case "$TARGET_APK" in
            *.apk) ;;
            *) echo "ERROR: File does not have .apk extension."; exit 1 ;;
          esac
          echo "Verified APK: $TARGET_APK ($(stat -c%s "$TARGET_APK") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$TEMP_DIR/app-debug.apk"
          if [ ! -f "$TEMP_DIR/app-debug.apk" ] || [ ! -s "$TEMP_DIR/app-debug.apk" ]; then
            echo "ERROR: Failed to prepare APK release asset."
            exit 1
          fi
          echo "asset_path=$TEMP_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $TEMP_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist at $ASSET_PATH"
            exit 1
          fi
          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset is empty."
            exit 1
          fi
          ASSET_NAME=$(basename "$ASSET_PATH")
          if [ "$ASSET_NAME" != "app-debug.apk" ]; then
            echo "ERROR: Release asset filename is not app-debug.apk (got $ASSET_NAME)"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### Automated Debug APK Build

          - **Build System:** Built automatically by GitHub Actions
          - **Workflow Run:** #${{ github.run_number }} (Attempt ${{ github.run_attempt }})
          - **Commit SHA:** \`${{ github.sha }}\`
          - **Environment:** Temurin Java 17 / Gradle 9.3.1

          > **Note:** This APK is an automatically generated debug build intended for testing purposes only. It is not a production release for the Google Play Store and is signed with a temporary debug keystore.
          EOF
          )

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "=== RELEASE PUBLISHED SUCCESSFULLY ==="
            gh release view "$TAG_NAME" || true
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Asset: app-debug.apk"
            echo "Direct APK URL: $DIRECT_URL"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## DIRECT APK DOWNLOAD

          [Download app-debug.apk]($DIRECT_URL)

          \`\`\`
          $DIRECT_URL
          \`\`\`

          - **Actions Backup Artifact:** \`app-debug-apk\` is also stored in the workflow summary.
          - **Release Tag:** \`$TAG_NAME\`
          EOF
          else
            echo "WARNING: GitHub Release creation did not succeed or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded and the backup Actions artifact 'app-debug-apk' remains available."
            fi
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## APK Build Summary

          - **APK Build Status:** Succeeded
          - **Backup Artifact:** \`app-debug-apk\` is available under Artifacts.
          - **GitHub Release Status:** Notice - Release publication was not completed.
          EOF
          fi
